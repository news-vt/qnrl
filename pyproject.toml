[project]
name = "qnrl"
version = "1.0.0"
authors = [
    {name = "Alexander DeRieux", email = "derieux@vt.edu"},
    {name = "Walid Saad", email = "walids@vt.edu"},
]
requires-python = ">=3.12, <3.13" # Fixing ==3.12 here.
license = {text = "CC BY 4.0"}
dependencies = [
    "deepdiff>=8.6.1",
    "filelock>=3.19.1",
    "flax>=0.11.2",
    "gymnasium>=1.2.0",
    "ipykernel>=6.30.1",
    "jax~=0.6.0", # Freeze version for compatibility with PennyLane.
    "jaxlib~=0.6.0", # Freeze version for compatibility with PennyLane.
    "mashumaro>=3.16",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "orbax-checkpoint~=0.11.0",
    "pennylane~=0.42.0", # Freeze version for compatibility.
    "plotext>=5.3.2",
    "rich>=14.1.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.43",
    "tqdm>=4.67.1",
    "tyro>=0.9.31",
]

[tool.setuptools.packages]
find = { exclude = ["metrics", "figures*", "scripts*", "experiments*", "experiment_output*"] }  # Scanning implicit namespaces is active by default

[dependency-groups]
dev = [
    "pylatexenc>=2.10",
    "qiskit>=2.2.0",
]
