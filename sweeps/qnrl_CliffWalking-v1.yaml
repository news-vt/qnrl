project: qnrl
name: qnrl/CliffWalking-v1
command:
  - ${envvar:WANDB_AGENT_INTERPRETER}
  - -m
  - qnrl.cli
  - train
  - ${args}

# Hyperparameter search style.
method: grid
metric:
  goal: maximize
  name: eval/episode_reward.mean

# Parameters for `qnrl.cli.Train`
parameters:
  num_eval:
    value: 10
  eval_seed:
    value: 1024
  config:
    parameters:
      seed:
        values:
          - 0
          - 21
          - 42
          - 84
      type:
        value: QnRL
      buffer_size:
        value: 10_000
      batch_size:
        value: 128
      total_timesteps:
        value: 100_000
      learning_starts:
        value: 10_000
      policy_update_frequency:
        value: 10
      target_update_frequency:
        value: 500
      gamma:
        value: 0.99
      tau:
        value: 1.0
      eps_start:
        value: 1
      eps_end:
        value: 5.0e-2
      eps_exploration:
        value: 0.5
      reseed_model_on_init:
        value: True
      ###
      # Environment
      ###
      env:
        parameters:
          type:
            value: ObservationDiscreteOneHot
          env:
            parameters:
              type:
                value: EnvConfig
              env_id:
                value: CliffWalking-v1
              max_episode_steps:
                value: 99
      num_atoms:
        value: 32 # 2^5
      ###
      # Model
      ###
      model:
        parameters:
          type:
            value: QuantumNativeQNetwork
          din:
            value: 48 # grid bounds
          n_actions:
            value: 4
          n_returns:
            value: 32 # 2^5
          z_min:
            value: -100
          z_max:
            value: 100
          m_moment:
            values: 
              - 1
              - 2 # second moment (variance)
          n_reuploads:
            values: 
              - 1
              - 4 # n_actions
          n_layers:
            values:
              - 3
              - 5
              - 7
          pauli_enc:
            value: ["RX"]
          pauli_var:
            value: ["RZ","RY","RZ"]
          imprimitive:
            values:
              - "offset-CZ"
              - "circ-CZ"
          input_multiplex_activation:
            value: "tanh"
          input_preprocess:
            value: null
          rngs_kwargs:
            parameters:
              default:
                value: 0
      ###
      # Optimizer
      ###
      optimizer:
        parameters:
          type:
            value: Partition
          transforms:
            parameters:
              trainable_quantum:
                parameters:
                  type:
                    value: AdamW
                  learning_rate:
                    value: 1.0e-2
                  b1:
                    value: 0.7
                  b2:
                    value: 0.999
                  weight_decay:
                    value: 5.0e-3
              trainable_classical:
                parameters:
                  type:
                    value: AdamW
                  learning_rate:
                    value: 1.0e-3
                  b1:
                    value: 0.7
                  b2:
                    value: 0.999
                  weight_decay:
                    value: 5.0e-3
          pytree:
            parameters:
              circ_weights_var:
                value: trainable_quantum
              circ_weights_enc_obs_kernel:
                value: trainable_quantum
              linear_input_projection:
                parameters: 
                  bias:
                    value: trainable_classical
                  kernel:
                    value: trainable_classical
