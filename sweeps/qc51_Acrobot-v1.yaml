project: qnrl
name: qc51/Acrobot-v1
command:
  - ${envvar:WANDB_AGENT_INTERPRETER}
  - -m
  - qnrl.cli
  - train
  - ${args}

# Hyperparameter search style.
method: grid
metric:
  goal: maximize
  name: eval/episode_reward.mean

# Parameters for `qnrl.cli.Train`
parameters:
  num_eval:
    value: 10
  eval_seed:
    value: 1024
  config:
    parameters:
      seed:
        values:
          - 0
          - 21
          - 42
          - 84
      type:
        value: C51
      buffer_size:
        value: 10_000
      batch_size:
        value: 128
      total_timesteps:
        value: 100_000
      learning_starts:
        value: 10_000
      policy_update_frequency:
        value: 10
      target_update_frequency:
        value: 500
      gamma:
        value: 0.99
      tau:
        value: 1.0
      eps_start:
        value: 1
      eps_end:
        value: 5.0e-2
      eps_exploration:
        value: 0.5
      reseed_model_on_init:
        value: True
      ###
      # Environment
      ###
      env:
        parameters:
          type:
            value: EnvConfig
          env_id:
            value: Acrobot-v1
      num_atoms:
        value: 32 # 2^5
      z_min:
        value: -100
      z_max:
        value: 100
      ###
      # Optimizer
      ###
      optimizer:
        parameters:
          type:
            value: Partition
          transforms:
            parameters:
              trainable_quantum:
                parameters:
                  type:
                    value: AdamW
                  learning_rate:
                    value: 1.0e-2
                  b1:
                    value: 0.7
                  b2:
                    value: 0.999
                  weight_decay:
                    value: 5.0e-3
              trainable_classical:
                parameters:
                  type:
                    value: AdamW
                  learning_rate:
                    value: 1.0e-3
                  b1:
                    value: 0.7
                  b2:
                    value: 0.999
                  weight_decay:
                    value: 5.0e-3
          pytree:
            parameters:
              circ_weights:
                value: trainable_quantum
              layer_project_input:
                parameters: 
                  bias:
                    value: trainable_classical
                  kernel:
                    value: trainable_classical
              layer_project_output:
                parameters: 
                  bias:
                    value: trainable_classical
                  kernel:
                    value: trainable_classical
      ###
      # Model
      ###
      model:
        parameters:
          type:
            value: QuantumDistQNetworkLinear
          din:
            value: 6
          num_actions:
            value: 3
          num_atoms:
            value: 32 # 2^5
          num_wires:
            values:
              - 3
              - 5
              - 7
          num_layers:
            values:
              - 3
              - 5
              - 7
          input_preprocess:
            parameters:
              type:
                value: RescaleInput
              scale:
                value: [1., 1., 1., 1., 12.5663706144, 28.2743338823] # 1,1,1,1,4*pi,9*pi
          rngs_kwargs:
            parameters:
              default:
                value: 0