project: qnrl
name: c51/Acrobot-v1
command:
  - uv
  - run
  - python 
  - -m
  - qnrl.cli
  - train
  - ${args}

# Hyperparameter search style.
method: grid
metric:
  goal: maximize
  name: eval/episode_reward.mean

# Parameters for `qnrl.cli.Train`
parameters:
  num_eval:
    value: 10
  eval_seed:
    value: 1024
  config:
    parameters:
      seed:
        values:
          - 0
          - 21
          - 42
          - 84
      type:
        value: C51
      buffer_size:
        value: 10_000
      batch_size:
        value: 128
      total_timesteps:
        value: 100_000
      learning_starts:
        value: 10_000
      policy_update_frequency:
        value: 10
      target_update_frequency:
        value: 500
      gamma:
        value: 0.99
      tau:
        value: 1.0
      eps_start:
        value: 1
      eps_end:
        value: 5.0e-2
      eps_exploration:
        value: 0.5
      reseed_model_on_init:
        value: True
      ###
      # Environment
      ###
      env:
        parameters:
          type:
            value: EnvConfig
          env_id:
            value: Acrobot-v1
      num_atoms:
        value: 32 # 2^5
      z_min:
        value: -100
      z_max:
        value: 100
      ###
      # Optimizer
      ###
      optimizer:
        parameters:
          type:
            value: Adam
          learning_rate:
            value: 1.0e-3
      ###
      # Model
      ###
      model:
        parameters:
          type:
            value: DistQNetworkLinear
          din:
            value: 6
          num_actions:
            value: 3
          num_atoms:
            value: 32 # 2^5
          douts:
            values:
              - [16,8]
              - [30,21]
              - [60,42]
              - [120,84]
          rngs_kwargs:
            parameters:
              default:
                value: 0