# dump_config: yaml
# dump_config: json
train_config:
  gym:
    env_id: MountainCar-v0
    render_mode: null
    max_episode_steps: null
    extra_args: null
  algorithm: dqn
  model_policy:
    din: 2
    num_actions: 3
    rngs_kwargs:
      default: 42
    douts: [120, 84]
  model_target:
    din: 2
    num_actions: 3
    rngs_kwargs:
      default: 43
    douts: [120, 84]
  optimizer:
    optimizer_id: adam
    learning_rate: 2.5e-4
    b1: 0.9
    b2: 0.999
    eps: 1.0e-08
    eps_root: 0.0
    mu_dtype: null
    nesterov: false
  buffer_size: 10000
  seed: 0
  batch_size: 128
  total_timesteps: 500000
  learning_starts: 10000
  policy_update_frequency: 10
  target_update_frequency: 500
  gamma: 0.99
  tau: 1.0
  eps_start: 1
  eps_end: 0.05
  eps_exploration: 0.5
  metrics_filepath: ./metrics/dqn-mountaincar-v0.json
  checkpoint:
    checkpoint_dir: ./checkpoints/dqn-mountaincar-v0
    checkpoint_options:
      save_interval_steps: 1
      max_to_keep: 2
      enable_async_checkpointing: true